# DEMONSTRATION multi-conteneurs, PAS deployment datacenter HA.
# Certificat TLS pour le DNS "coordinator" et secret a creer separement.
services:
  coordinator:
    build:
      context: ..
    command: ["node", "qne_v12/coordinator.js"]
    environment:
      QNE_V12_HOST: "0.0.0.0"
      QNE_V12_PORT: "17839"
      QNE_V12_DATA: "/var/lib/qne"
      QNE_V12_SECRET_FILE: "/run/secrets/cluster_token"
      QNE_V12_TLS_CERT: "/run/secrets/server_cert"
      QNE_V12_TLS_KEY: "/run/secrets/server_key"
    secrets: [cluster_token, server_cert, server_key]
    volumes:
      - qne_data:/var/lib/qne
    expose: ["17839"]
    restart: unless-stopped
  worker:
    build:
      context: ..
    command: ["node", "qne_v12/worker.js"]
    environment:
      QNE_V12_URL: "https://coordinator:17839"
      QNE_V12_SECRET_FILE: "/run/secrets/cluster_token"
      QNE_V12_CA_FILE: "/run/secrets/ca_cert"
    secrets: [cluster_token, ca_cert]
    depends_on: [coordinator]
    restart: unless-stopped
secrets:
  cluster_token:
    file: ./secrets/cluster_token
  server_cert:
    file: ./secrets/server.crt
  server_key:
    file: ./secrets/server.key
  ca_cert:
    file: ./secrets/ca.crt
volumes:
  qne_data:
